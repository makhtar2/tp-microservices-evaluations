openapi: 3.0.3
info:
  title: user-service API
  description: >
    Authentification, gestion des utilisateurs et des rôles
    (Administrateur, Enseignant, Étudiant).
  version: 0.1.0
servers:
  - url: http://localhost:3001
    description: Local (accès direct, hors API Gateway)

tags:
  - name: auth
  - name: users

paths:
  /auth/login:
    post:
      tags: [auth]
      summary: Authentifier un utilisateur et obtenir un token JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Authentification réussie
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: "#/components/schemas/User"
        "401":
          description: Identifiants invalides
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /users:
    get:
      tags: [users]
      summary: Lister les utilisateurs
      security: [{ bearerAuth: [] }]
      parameters:
        - name: role
          in: query
          schema:
            $ref: "#/components/schemas/Role"
        - name: active
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Liste des utilisateurs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      tags: [users]
      summary: Créer un utilisateur (réservé Administrateur)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: Utilisateur créé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Requête invalide
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Email déjà utilisé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [users]
      summary: Consulter un utilisateur
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Utilisateur trouvé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Utilisateur introuvable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags: [users]
      summary: Modifier le profil ou le rôle d'un utilisateur (Administrateur)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Utilisateur mis à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Utilisateur introuvable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /users/{id}/status:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      tags: [users]
      summary: Activer ou désactiver un compte (Administrateur)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                active:
                  type: boolean
      responses:
        "200":
          description: Statut mis à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Utilisateur introuvable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Role:
      type: string
      enum: [ADMINISTRATEUR, ENSEIGNANT, ETUDIANT]

    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        nom:
          type: string
        prenom:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time

    UserCreate:
      type: object
      required: [email, password, nom, prenom, role]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        nom:
          type: string
        prenom:
          type: string
        role:
          $ref: "#/components/schemas/Role"

    UserUpdate:
      type: object
      properties:
        nom:
          type: string
        prenom:
          type: string
        role:
          $ref: "#/components/schemas/Role"

    Error:
      type: object
      properties:
        message:
          type: string
